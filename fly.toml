# fly.toml app configuration file generated for huerta-iot on 2026-01-16T18:06:47-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'huerta-iot'
primary_region = 'gru'

[build]
  [build.args]
    GO_VERSION = '1.24'

[env]
  PORT = '8080'
  BROKER_MQTT = 'tcp://sensorwave-mqtt.internal:1884'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
